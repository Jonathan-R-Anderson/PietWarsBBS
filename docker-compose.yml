services:
  api:
    build: ./src/api
    container_name: game_api
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: always

  renderer:
    build:
      context: .
      dockerfile: src/renderer/Dockerfile
    container_name: game_renderer
    depends_on:
      - api
    ports:
      - "1337:1337"
      - "5001:5001"
      - "7331:7331"
    stdin_open: true
    tty: true
    restart: always
    environment:
      - API_BASE_URL=http://api:5000
      - P2P_STATE_DIR=/data/p2p
      - P2P_ENABLED=${P2P_ENABLED:-true}
      - P2P_BOOTSTRAP_MODE=${P2P_BOOTSTRAP_MODE:-false}
      - P2P_BOOTSTRAP_HOST=${P2P_BOOTSTRAP_HOST:-}
      - P2P_BOOTSTRAP_PORT=${P2P_BOOTSTRAP_PORT:-7331}
      - P2P_PEER_PORT=${P2P_PEER_PORT:-5001}
      - PLAYER_USERNAME=${PLAYER_USERNAME:-}
      - PLAYER_UNIQUE_ID=${PLAYER_UNIQUE_ID:-}
    volumes:
      - p2p_state:/data/p2p

volumes:
  p2p_state:
